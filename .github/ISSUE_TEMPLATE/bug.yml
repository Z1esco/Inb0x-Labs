name: Bug report
description: Report a reproducible product defect. Do not report security issues here.
title: "fix: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security vulnerabilities must be reported privately using SECURITY.md."
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, Node version, and demo/real mode. Remove secrets.
